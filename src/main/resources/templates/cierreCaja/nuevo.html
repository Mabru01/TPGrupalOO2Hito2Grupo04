<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <h1 class="mb-4">Resumen de Caja</h1>

        <!-- Formulario para seleccionar fecha -->
        <div class="card mb-4">
            <div class="card-header">
                <strong>Seleccionar fecha</strong>
            </div>
            <div class="card-body">
                <form th:action="@{/cierreCaja/nuevo}" method="get" class="form-inline">
                    <div class="form-group mr-3">
                        <label for="fecha" class="mr-2">Fecha:</label>
                        <input type="date" id="fecha" name="fecha" class="form-control mr-2"
                               th:value="${fecha}"/>
                    </div>
                    <button type="submit" class="btn btn-primary">Consultar</button>
                </form>
            </div>
        </div>

        <!-- Resumen del día -->
        <div class="card mb-4">
            <div class="card-header">
                <strong>Resumen del día</strong>
                <span th:text="' - ' + ${fecha}"></span>
            </div>
            <div class="card-body">
                <div class="row text-center">
                    <div class="col-md-4 mb-3">
                        <div class="card bg-primary text-white">
                            <div class="card-body">
                                <h5 class="card-title">Cantidad de Pedidos</h5>
                                <p class="card-text display-4" th:text="${cantidadPedidos}">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card bg-success text-white">
                            <div class="card-body">
                                <h5 class="card-title">Total Recaudado</h5>
                                <p class="card-text display-4" th:text="'$' + ${#numbers.formatDecimal(totalRecaudado, 1, 2)}">$0.00</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card bg-info text-white">
                            <div class="card-body">
                                <h5 class="card-title">Promedio por Pedido</h5>
                                <p class="card-text display-4" th:text="'$' + ${#numbers.formatDecimal(promedioPorPedido, 1, 2)}">$0.00</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detalle de pedidos -->
        <div class="card">
            <div class="card-header">
                <strong>Detalle de Pedidos</strong>
            </div>
            <div class="card-body">
                <div th:if="${pedidos.isEmpty()}" class="alert alert-warning">
                    No hay pedidos registrados para esta fecha.
                </div>
                <div th:if="${!pedidos.isEmpty()}" class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th>ID Pedido</th>
                            <th>Fecha</th>
                            <th>Ítems</th>
                            <th class="text-right">Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td th:text="${pedido.idPedido}">#</td>
                            <td th:text="${#temporals.format(pedido.fechaTransaccion, 'dd/MM/yyyy')}">Fecha</td>
                            <td>
                                <ul class="list-unstyled mb-0">
                                    <li th:each="item : ${pedido.items}">
                                        <span th:text="${item.plato.nombre}">Plato</span>
                                        <span th:text="' x' + ${item.cantidad}">x1</span>
                                    </li>
                                </ul>
                            </td>
                            <td class="text-right" th:text="'$' + ${#numbers.formatDecimal(pedido.getPrecioTotal(), 1, 2)}">$0.00</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Botón para confirmar cierre -->
        <div class="mt-4 text-center">
            <form th:action="@{/cierreCaja/cerrar}" method="post">
                <input type="hidden" name="fecha" th:value="${fecha}"/>
                <button type="submit" class="btn btn-success btn-lg">
                    <i class="fas fa-check"></i> Confirmar Cierre de Caja
                </button>
                <a th:href="@{/cierreCaja}" class="btn btn-secondary btn-lg ml-2">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </form>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
