<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión finalizada - Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
    <link rel="stylesheet" th:href="@{/css/epicentro.css}"/>
</head>
<body class="bg-light">

    <div class="login-container">
        <div class="card login-card">
            <div class="card-body">
                <div class="login-header">
                    <h3>Epicentro Gourmet</h3>
                </div>

                <div class="alert alert-success text-center">
                    Sesión finalizada correctamente.
                </div>

                <a th:href="@{/login}" class="btn btn-epicentro w-100">Iniciar sesión</a>
                <div class="text-center mt-3">
                    <a th:href="@{/index}" class="text-muted">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
