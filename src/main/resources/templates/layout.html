<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
    <link rel="stylesheet" th:href="@{/css/epicentro.css}"/>
</head>
<body>

    <!-- Navbar: muestra opciones distintas según haya sesión y según el rol -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-epicentro fixed-top" th:fragment="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/index}">Inicio</a>
                    </li>
                    <!-- Los roles se guardan sin prefijo (ADMIN); se acepta también ROLE_ADMIN -->
                    <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN', 'ROLE_ADMIN')">
                        <a class="nav-link" th:href="@{/unidadVenta}">Unidades de venta</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/liquidacion}">Liquidación de sueldo</a>
                    </li>
                </ul>

                <!-- Sin sesión: iniciar sesión (el registro está en la página de inicio) -->
                <div class="form-inline" sec:authorize="isAnonymous()">
                    <a class="btn btn-epicentro" th:href="@{/login}">Iniciar sesión</a>
                </div>

                <!-- Con sesión: usuario y cerrar sesión -->
                <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-toggle="dropdown">
                            <span sec:authentication="name">usuario</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">Cerrar sesión</button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Footer -->
    <footer class="footer-epicentro text-white py-4" th:fragment="footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Epicentro Gourmet - OO2 UNLa - Grupo 04</p>
        </div>
    </footer>

    <!-- Scripts -->
    <div th:fragment="scripts">
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </div>

</body>
</html>
