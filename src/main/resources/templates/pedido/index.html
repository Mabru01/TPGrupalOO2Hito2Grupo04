<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">

    <div class="card bg-light border-primary mb-4 shadow-sm" th:if="${unidadVenta != null}">
        <div class="card-body">
            <h5 class="card-title text-primary"><i class="bi bi-shop"></i> Mi Unidad Asignada</h5>
            <p class="mb-1"><strong>Unidad de Venta:</strong> <span th:text="${unidadVenta.nombreComercial}">Nombre Unidad</span></p>
            <p class="mb-0"><strong>Festival:</strong> <span th:text="${festival != null ? festival.nombre : '-'}">Nombre Festival</span></p>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Pedidos</h2>
        <a th:href="@{/pedido/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Nuevo Pedido
        </a>
    </div>

    <div th:if="${exito}" class="alert alert-success text-center" role="alert" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger text-center" role="alert" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Número</th>
                        <th>Precio Total</th>
                        <th>Fecha de Transacción</th>
                        <th class="text-center">Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Si la lista está vacía -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="5" class="text-center py-4 text-muted">
                            No hay pedidos registrados para tu unidad actualmente.
                        </td>
                    </tr>

                    <tr th:each="pedido : ${pedidos}">
                        <td class="font-weight-bold" th:text="${'#' + pedido.idPedido}">#1</td>
                        <td th:text="${'$' + #numbers.formatDecimal(pedido.precioTotal, 1, 'POINT', 2, 'COMMA')}">$0.00</td> <!-- CAMBIADO AQUÍ -->
                        <td th:text="${pedido.fechaTransaccion}">2026-10-26</td>
                        <td class="text-center">
                            <span th:if="${pedido.terminado}" class="badge badge-success px-2 py-1">Terminado</span>
                            <span th:unless="${pedido.terminado}" class="badge badge-warning px-2 py-1 text-dark">En curso</span>
                        </td>
                        <td class="text-center">
                            <button type="button"
                                    class="btn btn-info btn-sm text-white"
                                    data-toggle="modal"
                                    th:attr="data-target='#detalleModal-' + ${pedido.idPedido}">
                                Ver detalles
                            </button>

                            <a th:href="@{/pedido/editar/{id}(id=${pedido.idPedido})}" class="btn btn-warning btn-sm">Editar</a>

                            <button type="button"
                                    class="btn btn-danger btn-sm"
                                    data-toggle="modal"
                                    data-target="#confirmarEliminarPedidoModal"
                                    th:attr="data-id=${pedido.idPedido}, data-fecha=${pedido.fechaTransaccion}"
                                    onclick="prepararEliminacionPedido(this)">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
