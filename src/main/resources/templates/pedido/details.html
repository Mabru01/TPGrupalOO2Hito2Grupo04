<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Detalles del Pedido <span th:text="${'#' + pedido.idPedido}">#1</span></h2>
        <a th:href="@{/pedido}" class="btn btn-secondary">Volver al listado</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white">
            Información General
        </div>
        <div class="card-body">
            <p><strong>Unidad de Venta:</strong> <span th:text="${pedido.unidadVenta != null ? pedido.unidadVenta.nombreComercial : '-'}"></span></p>
            <p><strong>Fecha:</strong> <span th:text="${pedido.fechaTransaccion}"></span></p>
            <p><strong>Estado:</strong>
                <span th:if="${pedido.terminado}" class="badge badge-success">Terminado</span>
                <span th:unless="${pedido.terminado}" class="badge badge-warning text-dark">En curso</span>
            </p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
            Platos solicitados
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="thead-light">
                    <tr>
                        <th>Plato</th>
                        <th class="text-center">Cantidad</th>
                        <th class="text-right">Precio Unitario</th>
                        <th class="text-right">Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(pedido.items)}">
                        <td colspan="4" class="text-center py-4 text-muted">Este pedido no contiene ítems.</td>
                    </tr>
                    <tr th:each="item : ${pedido.items}">
                        <td th:text="${item.plato != null ? item.plato.nombre : 'Plato no disponible'}">Milanesa</td>
                        <td class="text-center" th:text="${item.cantidad}">2</td>
                        <td class="text-right" th:text="${item.plato != null ? '$' + item.plato.precio : '-'}">$1500</td>
                        <td class="text-right" th:text="${item.plato != null ? '$' + (item.plato.precio * item.cantidad) : '-'}">$3000</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
