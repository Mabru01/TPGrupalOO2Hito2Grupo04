<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pedidoDTO.idPedido != null} ? 'Editar Pedido - Epicentro Gourmet' : 'Nuevo Pedido - Epicentro Gourmet'">Nuevo Pedido - Epicentro Gourmet</title>
    <head th:replace="~{layout :: head}"></head>
</head>
<body>

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-9">

            <div class="card bg-light border-primary mb-4 shadow-sm" th:if="${unidadVenta != null}">
                <div class="card-body">
                    <h5 class="card-title text-primary"><i class="bi bi-info-circle"></i> Destino del Pedido</h5>
                    <p class="mb-1"><strong>Unidad de Venta:</strong> <span th:text="${unidadVenta.nombreComercial}">Nombre Unidad</span></p>
                    <p class="mb-0"><strong>Festival:</strong> <span th:text="${festival != null ? festival.nombre : '-'}">Nombre Festival</span></p>
                    <small class="text-muted">El pedido se asociará automáticamente a tu unidad.</small>
                </div>
            </div>

            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0" th:text="${pedidoDTO.idPedido != null} ? 'Editar Pedido #' + ${pedidoDTO.idPedido} : 'Registrar Nuevo Pedido'">Registrar Pedido</h4>
                </div>
                <div class="card-body">

                    <form th:action="${pedidoDTO.idPedido != null} ? @{/pedido/actualizar/{id}(id=${pedidoDTO.idPedido})} : @{/pedido/guardar}"
                          th:object="${pedidoDTO}" method="post" id="formPedido">

                        <input type="hidden" th:field="*{idUnidadVenta}" />

                        <div class="form-group mb-4">
                            <label for="fechaTransaccion">Fecha:</label>
                            <input type="date" id="fechaTransaccion" class="form-control" th:field="*{fechaTransaccion}" required />
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Ítems del Pedido</h5>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="agregarFilaItem()">
                                <i class="bi bi-plus"></i> + Agregar plato
                            </button>
                        </div>

                        <div id="contenedor-items">

                            <th:block th:if="${pedidoDTO.items != null and !pedidoDTO.items.empty}">
                                <div class="form-row item-row mb-3 align-items-end" th:each="item, iterStat : ${pedidoDTO.items}">
                                    <div class="form-group col-md-7 mb-0">
                                        <label>Plato:</label>
                                        <select class="form-control select-plato" th:name="items[__${iterStat.index}__].idPlato" required>
                                            <option value="">-- Seleccione un plato --</option>
                                            <option th:each="plato : ${platos}"
                                                    th:value="${plato.idPlato}"
                                                    th:text="${plato.nombre + ' ($' + plato.precio + ')'}"
                                                    th:selected="${plato.idPlato == item.idPlato}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="form-group col-md-3 mb-0">
                                        <label>Cantidad:</label>
                                        <input type="number" class="form-control" th:name="items[__${iterStat.index}__].cantidad" th:value="${item.cantidad}" min="1" required />
                                    </div>
                                    <div class="form-group col-md-2 mb-0 text-center">
                                        <button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">Eliminar</button>
                                    </div>
                                </div>
                            </th:block>

                            <th:block th:if="${pedidoDTO.items == null or pedidoDTO.items.empty}">
                                <div class="form-row item-row mb-3 align-items-end">
                                    <div class="form-group col-md-7 mb-0">
                                        <label>Plato:</label>
                                        <select class="form-control select-plato" name="items[0].idPlato" required>
                                            <option value="">-- Seleccione un plato --</option>
                                            <option th:each="plato : ${platos}"
                                                    th:value="${plato.idPlato}"
                                                    th:text="${plato.nombre + ' ($' + plato.precio + ')'}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="form-group col-md-3 mb-0">
                                        <label>Cantidad:</label>
                                        <input type="number" class="form-control" name="items[0].cantidad" min="1" value="1" required />
                                    </div>
                                    <div class="form-group col-md-2 mb-0 text-center">
                                        <button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">Eliminar</button>
                                    </div>
                                </div>
                            </th:block>

                        </div>

                        <select id="plantilla-platos" class="d-none">
                            <option value="">-- Seleccione un plato --</option>
                            <option th:each="plato : ${platos}"
                                    th:value="${plato.idPlato}"
                                    th:text="${plato.nombre + ' ($' + plato.precio + ')'}"></option>
                        </select>

                        <div class="form-group text-right mt-4">
                            <a th:href="@{/pedido}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success" th:text="${pedidoDTO.idPedido != null} ? 'Actualizar Pedido' : 'Guardar Pedido'">Guardar Pedido</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        actualizarIndices();
    });

    // Script para limpiar y clonar las opciones de la seleccion en el formulario evitando bugs.
    function agregarFilaItem() {
        const contenedor = document.getElementById('contenedor-items');

        const nuevaFila = document.createElement('div');
        nuevaFila.className = 'form-row item-row mb-3 align-items-end';
        nuevaFila.innerHTML = `
            <div class="form-group col-md-7 mb-0">
                <label>Plato:</label>
                <select class="form-control select-plato" required>
                </select>
            </div>
            <div class="form-group col-md-3 mb-0">
                <label>Cantidad:</label>
                <input type="number" class="form-control" min="1" value="1" required />
            </div>
            <div class="form-group col-md-2 mb-0 text-center">
                <button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">Eliminar</button>
            </div>
        `;

        contenedor.appendChild(nuevaFila);

        const nuevoSelect = nuevaFila.querySelector('.select-plato');

        nuevoSelect.innerHTML = '';
        const plantilla = document.querySelectorAll('#plantilla-platos option');
        plantilla.forEach(opt => {
            nuevoSelect.appendChild(opt.cloneNode(true));
        });

        actualizarIndices();
    }

    function eliminarFila(boton) {
        const fila = boton.closest('.item-row');
        fila.remove();
        actualizarIndices();
    }

    function actualizarIndices() {
        const filas = document.querySelectorAll('#contenedor-items .item-row');
        filas.forEach((fila, index) => {
            const selectPlato = fila.querySelector('.select-plato');
            const inputCantidad = fila.querySelector('input[type="number"]');

            if (selectPlato) {
                selectPlato.name = `items[${index}].idPlato`;
            }
            if (inputCantidad) {
                inputCantidad.name = `items[${index}].cantidad`;
            }
        });
    }
</script>

</body>
</html>
