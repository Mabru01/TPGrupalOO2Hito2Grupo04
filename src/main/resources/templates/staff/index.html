<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header mb-4 d-flex justify-content-between align-items-center mt-5">
        <h2>Empleados</h2>
        <div>
            <a th:href="@{/staff/nuevo/cocinero}" class="btn btn-success me-2">Nuevo Cocinero</a>
            <a th:href="@{/staff/nuevo/cajero}" class="btn btn-success me-2">Nuevo Cajero</a>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Empleado</th>
            <th>DNI</th>
            <th>Sueldo</th>
            <th>Tipo</th>
            <th>Activo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${staffs}">
            <td th:text="${s.nombre}"></td>
            <td th:text="${s.dni}"></td>
            <td th:text="${s.sueldoBase}"></td>
            <td th:text="${s.class.simpleName}"></td>
            <td>
                <span th:if="${s.fechaEgreso == null}" class="badge bg-success">Activo</span>
                <span th:unless="${s.fechaEgreso == null}" class="badge bg-danger">Inactivo</span>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
