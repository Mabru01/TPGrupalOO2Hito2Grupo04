<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="mb-4 text-center">
                <h2>Nuevo Plato</h2>
            </div>

            <div class="card bg-light border-primary mb-4 shadow-sm" th:if="${unidadVenta != null}">
                <div class="card-body text-center">
                    <h5 class="card-title text-primary"><i class="bi bi-info-circle"></i> Destino del Plato</h5>
                    <p class="mb-1"><strong>Unidad de Venta:</strong> <span th:text="${unidadVenta.nombreComercial}">Nombre Unidad</span></p>
                    <p class="mb-0"><strong>Festival:</strong> <span th:text="${festival != null ? festival.nombre : '-'}">Nombre Festival</span></p>
                    <small class="text-muted">El plato se asociará automáticamente a tu unidad asignada.</small>
                </div>
            </div>

            <div th:if="${error}" class="alert alert-danger text-center" role="alert">
                <span th:text="${error}">Mensaje de error</span>
            </div>

            <div class="card form-card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/plato/guardar}" th:object="${platoDTO}" method="post">

                        <input type="hidden" th:field="*{idPlato}" />

                        <div class="mb-3">
                            <label for="nombre" class="col-form-label">Nombre del Plato</label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required placeholder="Ej: Milanesa con fritas"/>
                        </div>

                        <div class="mb-3">
                            <label for="precio" class="col-form-label">Precio de Venta</label>
                            <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" required placeholder="Ej: 1500.00"/>
                        </div>

                        <div class="mb-3">
                            <label for="costo" class="col-form-label">Costo de Producción</label>
                            <input type="number" step="0.01" class="form-control" id="costo" th:field="*{costo}" required placeholder="Ej: 800.00"/>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <button type="submit" class="btn btn-success px-4">Guardar Plato</button>
                            <a th:href="@{/plato}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
