<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body text-center">
                    <div class="mb-4">
                        <span class="text-success fs-1">&#10004;</span>
                        <h2 class="text-success mt-2">El Plato se registro correctamente</h2>
                    </div>

                    <div class="card bg-light mb-4 text-start p-3">
                        <h5 class="card-title text-secondary border-bottom pb-2">Plato registrado:</h5>
                        <p class="mb-2"><strong>Nombre:</strong> <span th:text="${plato.nombre}">Nombre</span></p>
                        <p class="mb-2"><strong>Precio de Venta:</strong> $<span th:text="${plato.precio}">0.00</span></p>
                        <p class="mb-2"><strong>Costo:</strong> $<span th:text="${plato.costo}">0.00</span></p>
                        <p class="mb-0"><strong>Unidad de Venta:</strong> <span th:text="${plato.unidadVenta != null ? plato.unidadVenta.nombreComercial : '-'}">Unidad</span></p>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/index}" class="btn btn-primary px-4">Inicio</a>
                        <a th:href="@{/plato/nuevo}" class="btn btn-success px-4">Nuevo plato</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
