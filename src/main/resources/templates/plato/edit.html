<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="mb-4 text-center">
        <h2>Modificar Plato</h2>
    </div>

    <!-- Alerta de error si existe -->
    <div th:if="${error}" class="alert alert-danger text-center" role="alert">
        <span th:text="${error}">Mensaje de error</span>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form th:action="@{/plato/actualizar}" th:object="${platoDTO}" method="post">
                <!-- Uso de ID para actualizar -->
                <input type="hidden" th:field="*{idPlato}" />

                <!-- Manejar la edición por ID -->
                <input type="hidden" th:field="*{idPlato}" />

                <div class="mb-3">
                    <label for="idUnidadVenta" class="col-form-label">Unidad de Venta</label>
                    <select class="form-control" id="idUnidadVenta" th:field="*{idUnidadVenta}" required>
                        <option value="">Seleccione una unidad de venta</option>
                        <option th:each="u : ${unidadesVenta}" th:value="${u.idUnidadVenta}" th:text="${u.nombreComercial}">Unidad</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="nombre" class="col-form-label">Nombre del Plato</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required placeholder="Ej: Milanesa con fritas"/>
                </div>

                <div class="mb-3">
                    <label for="precio" class="col-form-label">Precio de Venta</label>
                    <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" required placeholder="Ej: 1500.00"/>
                </div>

                <div class="mb-3">
                    <label for="costo" class="col-form-label">Costo de Producción</label>
                    <input type="number" step="0.01" class="form-control" id="costo" th:field="*{costo}" required placeholder="Ej: 800.00"/>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-success px-4">Confirmar</button>
                    <a th:href="@{/plato}" class="btn btn-outline-secondary px-4">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
