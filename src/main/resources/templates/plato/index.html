<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">

    <!-- Encabezado con título y botón para ir a agregar nuevo plato -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Platos</h2>
        <a th:href="@{/plato/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Nuevo Plato
        </a>
    </div>

    <!-- Mensajes de éxito o error -->
    <div th:if="${exito}" class="alert alert-success text-center" role="alert" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger text-center" role="alert" th:text="${error}"></div>

    <!-- Tabla de Platos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Unidad de Venta</th>
                        <th>Precio</th>
                        <th>Costo</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Si la lista está vacía -->
                    <tr th:if="${#lists.isEmpty(platos)}">
                        <td colspan="5" class="text-center py-4 text-muted">
                            No hay platos registrados actualmente.
                        </td>
                    </tr>

                    <!-- Iteración sobre la lista de platos (ordenada por unidad de venta desde el servicio/repositorio) -->
                    <tr th:each="p : ${platos}">
                        <td th:text="${p.nombre}">Milanesa con fritas</td>
                        <td th:text="${p.unidadVenta != null ? p.unidadVenta.nombreComercial : '-'}">Unidad</td>
                        <td th:text="${'$' + p.precio}">$1500.00</td>
                        <td th:text="${'$' + p.costo}">$800.00</td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <!-- Botón Modificar en celeste -->
                                <a th:href="@{/plato/editar/{id}(id=${p.idPlato})}"
                                   class="btn btn-info text-white me-1"
                                   title="Editar plato">
                                    Modificar
                                </a>

                                <!-- Botón Eliminar que activa el Modal de Bootstrap -->
                                <button type="button"
                                        class="btn btn-danger"
                                        data-toggle="modal"
                                        data-target="#confirmarEliminarModal"
                                        th:data-id="${p.idPlato}"
                                        th:data-nombre="${p.nombre}"
                                        onclick="prepararEliminacion(this)"
                                        title="Eliminar plato">
                                    Eliminar
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!--  Modal de eliminación  -->
<div class="modal fade" id="confirmarEliminarModal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="modalLabel">Confirmar eliminación</h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                ¿Está seguro de que desea eliminar el plato <strong id="nombrePlatoModal"></strong>?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <a id="btnConfirmarEliminar" href="#" class="btn btn-danger">Eliminar</a>
            </div>
        </div>
    </div>
</div>

<!-- Script para usar el ID y el nombre en el Modal -->
<script>
    function prepararEliminacion(button) {
        var id = button.getAttribute("data-id");
        var nombre = button.getAttribute("data-nombre");

        // Se muestra el nombre del plato en el texto del modal
        document.getElementById("nombrePlatoModal").textContent = nombre;

        var botonConfirmar = document.getElementById("btnConfirmarEliminar");
        botonConfirmar.href = "/plato/eliminar/" + id;
    }
</script>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
