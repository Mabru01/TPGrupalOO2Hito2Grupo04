<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header mb-4 d-flex justify-content-between align-items-center" >
        <h2 sec:authorize="hasAnyAuthority('ADMIN', 'ROLE_ADMIN')" >Unidades de Venta</h2>
        <h2 sec:authorize="hasAnyAuthority('RESPONSABLE')" >Unidad a cargo</h2>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nombre comercial</th>
            <th>Código único</th>
            <th>Superficie</th>
            <th>Activo</th>
            <th class="text-center" sec:authorize="hasAnyAuthority('RESPONSABLE')" >Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${unidadVentas}">
            <td th:text="${u.nombreComercial}"></td>
            <td th:text="${u.codigoUnico}"></td>
            <td th:text="${u.superficie}"></td>
            <td th:text="${u.activa}"></td>
            <td class="text-center" sec:authorize="hasAnyAuthority('RESPONSABLE')" >
                <!-- Botón para abrir el modal -->
                <button type="button"
                        class="btn btn-info btn-sm text-white"
                        data-toggle="modal"
                        th:data-target="${'#canonModal-' + u.idUnidadVenta}">
                    Ver Canon
                </button>

                <a th:href="@{/unidadVenta/modificar}" class="btn btn-info btn-sm text-white">
                    Modificar
                </a>
                <button type="button"
                        class="btn btn-info btn-sm text-white">
                    Baja
                </button>

                <!-- Modal exclusivo para esta unidad de venta -->
                <div class="modal fade" th:id="${'canonModal-' + u.idUnidadVenta}" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Cálculo de Canon</h5>
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>                            </div>
                            <div class="modal-body text-start">
                                <p><strong>Unidad:</strong> <span th:text="${u.nombreComercial}"></span></p>
                                <p><strong>Código:</strong> <span th:text="${u.codigoUnico}"></span></p>
                                <hr>
                                <h4 class="text-success">
                                    Total Canon: $<span th:text="${u.calcularCanon()}"></span>
                                </h4>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Cerrar</button>                            </div>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
