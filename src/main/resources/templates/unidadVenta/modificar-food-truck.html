<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="unidadVentaDTO" type="TPGrupalOO2Hito2Grupo04.dtos.FoodTruckDTO"*/-->
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header mb-4">
        <h2>Modificar: Food Truck</h2>
    </div>

    <div class="card form-card">
        <div class="card-body">

            <form th:action="@{/unidadVenta/actualizar/foodtruck/{id}(id=*{idUnidadVenta})}"
                  th:object="${foodTruckDTO}" method="post">

                <h5 class="text-secondary border-bottom pb-2 mb-3">Modificar Datos del Food Truck</h5>

                <!-- Alerta de error por controller -->
                <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
                    <span th:text="${error}"></span>
                </div>

                <!-- Campo oculto para mantener el ID -->
                <input type="hidden" th:field="*{idUnidadVenta}"/>

                <div class="mb-3">
                    <label for="nombreComercial" class="col-form-label">Nombre Comercial</label>
                    <input type="text" class="form-control" id="nombreComercial"
                           th:field="*{nombreComercial}" required/>
                </div>
                <div class="mb-3">
                    <label for="superficie" class="col-form-label">Superficie</label>
                    <input type="number" step="0.01" min="0.1" class="form-control" id="superficie"
                           th:field="*{superficie}" required/>
                </div>
                <div class="mb-3">
                    <label for="patente" class="col-form-label">Patente</label>
                    <input type="text" class="form-control" id="patente" th:field="*{patente}" required/>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="usaLuz" th:field="*{usaLuz}"/>
                    <label for="usaLuz" class="form-check-label">Usa luz</label>
                </div>

                <div class="d-flex mt-4">
                    <button type="submit" class="btn btn-primary me-2">Guardar Cambios</button>
                    <a th:href="@{/unidadVenta/mi-unidad}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>


        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
